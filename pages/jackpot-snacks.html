<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Sewa - Jackpot Snacks</title>
  <link rel="stylesheet" href="style.css">
  <!-- Font Awesome Icons को लागि -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- CLEAR SLIDESHOW SECTION -->
  <section class="slideshow-container">
    <div class="slide active">
      <!-- Dark Overlay opacity मिलाउनका लागि -->
      <div class="slide-overlay"></div>
      <img src="jackpot-k-puffcorn.jpg" alt="Jackpot K-Puffcorn" class="slide-img">
      <div class="slide-content">
        <h2>Jackpot K-Puffcorn</h2>
        <p>Cheese Flavour - Har Bite Ma Cheese Ko Mazza!</p>
      </div>
    </div>
  </section>

  <!-- PRODUCTS GRID SECTION -->
  <section class="products-container">
    
    <!-- Product Card 1 -->
    <div class="product-card">
      <img src="jackpot-achari-masti.jpg" alt="Jackpot Achari Masti">
      <h3>Jackpot Achari Masti</h3>
      <p class="price">Rs. 20</p>
      
      <!-- Social Media Share Section -->
      <div class="share-section">
        <span>Share:</span>
        <button onclick="shareOnFacebook('https://ranjitshrestha1.com.np/pages/jackpot-snacks', 'Jackpot Achari Masti')" class="share-btn fb"><i class="fab fa-facebook-f"></i></button>
        <button onclick="shareOnWhatsApp('https://ranjitshrestha1.com.np/pages/jackpot-snacks', 'Jackpot Achari Masti')" class="share-btn wa"><i class="fab fa-whatsapp"></i></button>
        <button onclick="shareOnViber('https://ranjitshrestha1.com.np/pages/jackpot-snacks', 'Jackpot Achari Masti')" class="share-btn vb"><i class="fab fa-viber"></i></button>
        <button onclick="nativeShare('Jackpot Achari Masti', 'https://ranjitshrestha1.com.np/pages/jackpot-snacks')" class="share-btn native"><i class="fas fa-share-alt"></i></button>
      </div>
    </div>

    <!-- Product Card 2 -->
    <div class="product-card">
      <img src="jackpot-puffcorn.jpg" alt="Jackpot Puffcorn Hot Chilli">
      <h3>Jackpot Puffcorn (Hot Chilli)</h3>
      <p class="price">Rs. 20</p>
      
      <!-- Social Media Share Section -->
      <div class="share-section">
        <span>Share:</span>
        <button onclick="shareOnFacebook('https://ranjitshrestha1.com.np/pages/jackpot-snacks', 'Jackpot Puffcorn')" class="share-btn fb"><i class="fab fa-facebook-f"></i></button>
        <button onclick="shareOnWhatsApp('https://ranjitshrestha1.com.np/pages/jackpot-snacks', 'Jackpot Puffcorn')" class="share-btn wa"><i class="fab fa-whatsapp"></i></button>
        <button onclick="shareOnViber('https://ranjitshrestha1.com.np/pages/jackpot-snacks', 'Jackpot Puffcorn')" class="share-btn vb"><i class="fab fa-viber"></i></button>
        <button onclick="nativeShare('Jackpot Puffcorn', 'https://ranjitshrestha1.com.np/pages/jackpot-snacks')" class="share-btn native"><i class="fas fa-share-alt"></i></button>
      </div>
    </div>

  </section>

  <script src="script.js"></script>
</body>
</html>
