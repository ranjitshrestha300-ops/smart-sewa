<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Sewa Nepal | Premium Digital Hub & Media Center</title>
    
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1922041060809267" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">

    <!-- Favicon Configuration -->
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-icon-180x180.png">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
    <link rel="manifest" href="icons/manifest.json">
    <meta name="theme-color" content="#ffffff">
    
    <style>
        /* --- Header & Navigation Fixes --- */
        .nav-wrapper {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            padding: 10px 20px;
        }

        header nav ul {
            display: flex;
            align-items: center;
            gap: 15px;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        header nav ul li a {
            white-space: nowrap;
            display: inline-block;
            text-decoration: none;
            font-size: 14px;
        }

        /* Search bar */
        .header-search-container {
            display: flex;
            align-items: center;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 20px;
            padding: 4px 12px;
            margin: 0 10px;
            flex-grow: 1;
            max-width: 300px;
        }
        .header-search-container input {
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            padding: 6px;
            width: 100%;
            font-size: 13px;
        }
        .header-search-container button {
            background: transparent;
            border: none;
            color: #f59e0b;
            cursor: pointer;
            font-size: 14px;
        }

        /* --- Daraz-Style Pure Photo/Banner Slideshow --- */
        .full-hero-slideshow {
            position: relative;
            width: 100%;
            max-width: 1200px;
            height: 380px;
            margin: 20px auto;
            overflow: hidden;
            border-radius: 12px;
            background: #000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        .slideshow-track {
            display: flex;
            width: 100%;
            height: 100%;
            transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .slide-banner-item {
            min-width: 100%;
            height: 100%;
            display: block;
            position: relative;
            text-decoration: none;
            overflow: hidden;
        }

        .slide-banner-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Next/Prev Navigation Buttons */
        .slide-nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.4);
            color: #fff;
            border: none;
            width: 42px;
            height: 42px;
            cursor: pointer;
            border-radius: 50%;
            z-index: 10;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .slide-nav-btn:hover {
            background: #f57224; /* Daraz Orange Accent */
            color: #fff;
        }

        .slide-nav-btn.prev { left: 15px; }
        .slide-nav-btn.next { right: 15px; }

        /* Slider Indicators / Dots */
        .slide-indicators {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            z-index: 10;
        }

        .indicator-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: background 0.3s;
        }

        .indicator-dot.active {
            background: #f57224;
            width: 24px;
            border-radius: 10px;
        }

        @media (max-width: 768px) {
            .full-hero-slideshow { height: 220px; }
            .slide-nav-btn { width: 32px; height: 32px; font-size: 14px; }
        }

        /* Layout Fixes */
        .premium-vertical-ticker { background: #0f172a; border-bottom: 2px solid #f59e0b; padding: 12px 20px; display: flex; align-items: center; overflow: hidden; height: 45px; box-sizing: border-box; }
        .ticker-badge { background: #f59e0b; color: #000; padding: 4px 12px; font-size: 12px; font-weight: 800; border-radius: 4px; text-transform: uppercase; margin-right: 15px; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
        .ticker-viewport { position: relative; height: 100%; width: 100%; overflow: hidden; }
        .ticker-list { margin: 0; padding: 0; list-style: none; position: absolute; width: 100%; animation: verticalTicker 12s cubic-bezier(0.645, 0.045, 0.355, 1) infinite; }
        .ticker-list li { height: 21px; line-height: 21px; color: #e2e8f0; font-size: 13.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .ticker-list li i { color: #f59e0b; margin-right: 8px; }
        @keyframes verticalTicker { 0%, 25% { transform: translateY(0); } 30%, 55% { transform: translateY(-21px); } 60%, 85% { transform: translateY(-42px); } 90%, 100% { transform: translateY(0); } }
    </style>
</head>
<body>

    <header>
        <div class="nav-wrapper">
            <a href="index.html" class="brand-master-logo">
                <div class="brand-typography-block">
                    <div class="brand-main-title">Smart<span>Sewa</span></div>
                    <div class="brand-sub-tag">Nepal Hub</div>
                </div>
            </a>

            <!-- Search Bar -->
            <form action="/search" method="GET" class="header-search-container">
                <input type="text" placeholder="Search accessories, services..." name="q" required>
                <button type="submit"><i class="fa-solid fa-magnifying-glass"></i></button>
            </form>

            <nav>
                <ul>
                    <li><a href="pages/accessories.html">Accessories</a></li>
                    <li><a href="pages/vlog-gaming.html">Vlog & Gaming</a></li>
                    <li><a href="pages/insurance-post1.html" style="color: #f59e0b; font-weight: bold;">Insurance Plans</a></li>
                    <li><a href="pages/repair-hub.html">Repair Hub</a></li>
                    <li><a href="pages/gallery.html">Photo Gallery</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- 🖼️ Daraz-Style Dynamic Photo Slideshow Section -->
    <div class="full-hero-slideshow">
        <div class="slideshow-track" id="dynamicSlideshowTrack">
            <!-- JS मार्फत फोटो ब्यानरहरू यहाँ लोड हुनेछन् -->
        </div>
        
        <!-- Previous / Next Buttons -->
        <button class="slide-nav-btn prev" onclick="changeProductSlide(-1)">&#10094;</button>
        <button class="slide-nav-btn next" onclick="changeProductSlide(1)">&#10095;</button>
        
        <!-- Slider Dots -->
        <div class="slide-indicators" id="slideIndicators"></div>
    </div>

    <!-- 🚀 Ticker Section -->
    <div class="premium-vertical-ticker">
        <div class="ticker-badge"><i class="fa-solid fa-bolt"></i> Updates</div>
        <div class="ticker-viewport">
            <ul class="ticker-list" id="main-page-ticker">
                <li><i class="fa-solid fa-sync fa-spin"></i> नयाँ अपडेटहरू लोड हुँदैछन्...</li>
            </ul>
        </div>
    </div>

    <div class="main-wrapper">
        <div style="margin-bottom: 40px;">
            <h2 class="block-title"><i class="fa-solid fa-newspaper" style="color: #f59e0b;"></i> भर्खरका नयाँ पोस्टहरू (Latest Updates)</h2>
            <div id="dynamic-posts-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px;">
                <!-- JSON Posts Dynamic Load -->
            </div>
        </div>
    </div>

    <!-- JavaScript For Dynamic Slideshow with Photos & Page Links -->
    <script>
        // स्लाइडरमा देखिने ब्यानर तस्बीर र त्यसको Target Link (Page URL)
        const bannerSlides = [
            {
                image: "https://images.unsplash.com/photo-1590658268037-6bf12165a8df?auto=format&fit=crop&w=1200&q=80", 
                link: "pages/accessories.html",
                title: "Earbuds Special Offer"
            },
            {
                image: "https://images.unsplash.com/photo-1454165804606-c3d57bc86b40?auto=format&fit=crop&w=1200&q=80", 
                link: "pages/insurance-post1.html",
                title: "Smart Sewa Insurance Plans"
            },
            {
                image: "https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=1200&q=80", 
                link: "pages/vlog-gaming.html",
                title: "Gaming & Vlog Hub"
            }
        ];

        let currentSlideIdx = 0;
        let autoSlideTimer;

        function renderSlideshow() {
            const track = document.getElementById('dynamicSlideshowTrack');
            const indicators = document.getElementById('slideIndicators');
            
            if(!track) return;
            track.innerHTML = '';
            indicators.innerHTML = '';

            bannerSlides.forEach((slide, idx) => {
                // ब्यानर (Image) र Link जोड्ने एंकर ट्याग (a tag)
                const slideAnchor = document.createElement('a');
                slideAnchor.href = slide.link;
                slideAnchor.className = 'slide-banner-item';
                slideAnchor.innerHTML = `<img src="${slide.image}" alt="${slide.title}">`;
                track.appendChild(slideAnchor);

                // Indicator Dots
                const dot = document.createElement('div');
                dot.className = `indicator-dot ${idx === 0 ? 'active' : ''}`;
                dot.onclick = () => goToSlide(idx);
                indicators.appendChild(dot);
            });

            startAutoSlide();
        }

        function changeProductSlide(step) {
            currentSlideIdx = (currentSlideIdx + step + bannerSlides.length) % bannerSlides.length;
            updateSlidePosition();
            resetAutoSlide();
        }

        function goToSlide(index) {
            currentSlideIdx = index;
            updateSlidePosition();
            resetAutoSlide();
        }

        function updateSlidePosition() {
            const track = document.getElementById('dynamicSlideshowTrack');
            const dots = document.querySelectorAll('.indicator-dot');
            
            if(track) {
                track.style.transform = `translateX(-${currentSlideIdx * 100}%)`;
            }

            dots.forEach((dot, idx) => {
                if(idx === currentSlideIdx) {
                    dot.classList.add('active');
                } else {
                    dot.classList.remove('active');
                }
            });
        }

        function startAutoSlide() {
            autoSlideTimer = setInterval(() => {
                changeProductSlide(1);
            }, 4000); // ४ सेकेन्डमा स्वतः फोटो चेन्ज हुनेछ
        }

        function resetAutoSlide() {
            clearInterval(autoSlideTimer);
            startAutoSlide();
        }

        document.addEventListener('DOMContentLoaded', renderSlideshow);
    </script>
</body>
</html>
